services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Only exposed on localhost of the host machine for debugging;
      # remove this mapping entirely in a real production deployment
      # so Postgres is reachable only from the app container over the
      # internal docker network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Nuxt/Nitro only picks up runtimeConfig overrides at server startup
      # via NUXT_-prefixed env vars (see nuxt.config.ts runtimeConfig) — the
      # bare names below (from .env) are just for human-friendly naming and
      # don't map to runtimeConfig on their own.
      NUXT_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      NUXT_JWT_SECRET: ${JWT_SECRET}
      NUXT_RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      NUXT_GROQ_API_KEY: ${GROQ_API_KEY}
      NUXT_PUBLIC_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
      NUXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Runs prisma migrations using the "builder" stage, which has the full
  # node_modules (including the prisma CLI) unlike the slim "runner" image
  # used by the app service. Not started by `docker compose up`; run it
  # explicitly with `docker compose run --rm migrate`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    # `command` (not `entrypoint`) so it can be overridden, e.g.
    # `docker compose run --rm migrate npx prisma migrate resolve --rolled-back <name>`
    command: ["npx", "prisma", "migrate", "deploy"]
    profiles:
      - tools

volumes:
  db_data:
